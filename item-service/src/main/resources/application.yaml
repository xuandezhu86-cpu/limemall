server:
  port: 8081
lm:
  db:
    database: lm_item
  swagger:
    title: "青柠商场商品服务接口文档"
    package: com.limemall.item.controller
  # 商品详情多级缓存参数
  cache:
    local:
      maximum-size: 1000              # 本地缓存最大条目
      expire-after-write-seconds: 30  # 本地缓存写入后过期时间（短 TTL，降低与 DB 不一致的窗口）
    redis:
      ttl-seconds: 600                # 二级缓存基础过期时间
      jitter-seconds: 60              # 过期时间随机抖动，避免同一时刻大面积失效（缓存雪崩）
    null-ttl-seconds: 60              # 空值缓存时间（防止缓存穿透反复打库）
    lock:
      timeout-seconds: 3              # 重建缓存用的互斥锁超时
      wait-millis: 50                 # 未抢到锁时的自旋间隔
      max-retries: 5                  # 自旋重试次数
    bloom:
      bit-size: 16777216              # 布隆过滤器位图大小（16M bit ≈ 2MB）
      hash-count: 4                   # 哈希函数个数

spring:
  # 链路追踪：本地演示全量采样，生产建议按比例采样（如 0.1）
  sleuth:
    sampler:
      probability: 1.0
  zipkin:
    base-url: http://localhost:9411
    sender:
      type: web
  # springfox 2.10.5 不支持 Boot 2.6+ 默认的 PathPatternParser，需回退到 ant 匹配
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  redis:
    host: localhost
    port: 6381
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 50
        max-idle: 20
        min-idle: 5
        max-wait: 2000ms
  rabbitmq:
    host: localhost
    port: 5672
    virtual-host: /limemall
    username: limemall
    password: LmMq2026

# ---------- 可观测性：健康检查与 Prometheus 指标 ----------
management:
  # 管理端口与业务端口分离：Actuator 不暴露在业务端口上（也更安全）
  server:
    port: 9081
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    # 打开 HTTP 接口的直方图，Prometheus 才能算 P95/P99（慢接口告警依赖它）
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
      minimum-expected-value:
        http.server.requests: 5ms
      maximum-expected-value:
        http.server.requests: 5s
  prometheus:
    metrics:
      export:
        enabled: true
