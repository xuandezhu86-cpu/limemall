server:
  port: 8080
lm:
  jwt:
    location: classpath:limemall.jks
    alias: limemall
    password: limemall123
    tokenTTL: 30m
  auth:
    excludePaths:
      - /search/**
      - /users/login
      - /items/**
      - /hi

# ---------- 可观测性：健康检查与 Prometheus 指标 ----------
management:
  # 管理端口与业务端口分离：Actuator 不暴露在业务端口上（也更安全）
  server:
    port: 9080
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    # 打开 HTTP 接口的直方图，Prometheus 才能算 P95/P99（慢接口告警依赖它）
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
      minimum-expected-value:
        http.server.requests: 5ms
      maximum-expected-value:
        http.server.requests: 5s
  prometheus:
    metrics:
      export:
        enabled: true

spring:
  # 链路追踪：本地演示全量采样，生产建议按比例采样（如 0.1）
  sleuth:
    sampler:
      probability: 1.0
  zipkin:
    base-url: http://localhost:9411
    sender:
      type: web
