server:
  port: 8087

lm:
  db:
    database: lm_seckill
  swagger:
    title: "青柠商城秒杀服务接口文档"
    package: com.limemall.seckill.controller

spring:
  # springfox 2.10.5 不支持 Boot 2.6+ 默认的 PathPatternParser，需回退到 ant 匹配
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  redis:
    host: localhost
    port: 6381
    database: 1
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 50
        max-idle: 20
        min-idle: 5
        max-wait: 2000ms
  rabbitmq:
    host: localhost
    port: 5672
    virtual-host: /limemall
    username: limemall
    password: LmMq2026
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 20
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2
          max-interval: 5000ms

feign:
  okhttp:
    enabled: true

# 秒杀相关可调参数
seckill:
  # 令牌桶限流：容量 + 每秒补充速率（按活动维度）
  rate-limit:
    capacity: 3000
    rate: 1500
  # 对账/补偿任务
  reconcile:
    cron: "0/30 * * * * ?"
    # 处理中订单超过该秒数仍未完成，视为需要补偿
    timeout-seconds: 30
    # Redis 与 DB 库存差异容忍度，超过则告警
    stock-tolerance: 0

# ---------- 可观测性：健康检查与 Prometheus 指标 ----------
management:
  # 管理端口与业务端口分离：Actuator 不暴露在业务端口上（也更安全）
  server:
    port: 9087
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    # 打开 HTTP 接口的直方图，Prometheus 才能算 P95/P99（慢接口告警依赖它）
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
      minimum-expected-value:
        http.server.requests: 5ms
      maximum-expected-value:
        http.server.requests: 5s
  prometheus:
    metrics:
      export:
        enabled: true
