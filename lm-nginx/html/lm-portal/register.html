<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=9; IE=8; IE=7; IE=EDGE">
  <meta http-equiv="X-UA-Compatible" content="IE=EmulateIE7"/>
  <title>青柠商城--注册新用户</title>

  <link rel="stylesheet" type="text/css" href="./css/index.css"/>
  <link rel="stylesheet" type="text/css" href="./css/webbase.css"/>
  <link rel="stylesheet" type="text/css" href="./css/pages-login.css"/>
</head>

<body>
<div class="login-box" id="registerApp">
  <top></top>
  <!--head-->
  <div class="py-container logoArea">
    <div class="banner">
      <div class="logo">
        <img src="./img/logo.png" alt="1"/>
      </div>
    </div>
  </div>
  <!--registerArea-->
  <div class="loginArea">
    <div class="py-container login">
      <div class="loginform">
        <ul class="sui-nav nav-tabs tab-wraped">
          <li class="active">
            <a href="#register" data-toggle="tab">
              <h3>注册新用户</h3>
            </a>
          </li>
        </ul>
        <div class="tab-content tab-wraped">
          <div id="register" class="tab-pane active">
            <span v-text="msg" :style="msgStyle"></span>
            <form class="sui-form" @submit.prevent="register">
              <div class="input-prepend"><span class="add-on loginname"></span>
                <input id="username" type="text" placeholder="用户名（4~20 位字母、数字或下划线）"
                       class="span2 input-xfat" v-model="form.username">
              </div>
              <div class="input-prepend"><span class="add-on loginpwd"></span>
                <input id="password" type="password" placeholder="密码（6~20 位）" class="span2 input-xfat"
                       v-model="form.password">
              </div>
              <div class="input-prepend"><span class="add-on loginpwd"></span>
                <input id="confirmPassword" type="password" placeholder="请再次输入密码" class="span2 input-xfat"
                       v-model="form.confirmPassword">
              </div>
              <div class="input-prepend"><span class="add-on loginname"></span>
                <input id="phone" type="text" placeholder="手机号（选填）" class="span2 input-xfat"
                       v-model="form.phone">
              </div>
              <div class="setting">
                <label class="checkbox inline">
                  注册即表示同意《青柠商城用户协议》
                </label>
              </div>
              <div class="logined">
                <a class="sui-btn btn-block btn-xlarge btn-danger" @click="register"
                   href="javascript:void(0)">注&nbsp;&nbsp;册</a>
              </div>
            </form>
            <div class="otherlogin">
              <span class="register">已有账号？<a href="./login.html">去登录</a></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

</body>
<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<script src="./js/common.js"></script>
<script src="./js/top.js"></script>
<script type="text/javascript">
  var registerVm = new Vue({
    el: "#registerApp",
    data: {
      form: {
        username: '',
        password: '',
        confirmPassword: '',
        phone: ''
      },
      msg: '',
      msgColor: '#e1251b',
      util
    },
    computed: {
      msgStyle() {
        return 'display:block;color:' + this.msgColor + ';margin-bottom:8px;';
      }
    },
    methods: {
      // 前端先做一遍校验，减少无意义的请求；后端同样会校验（不能只靠前端）
      check() {
        const f = this.form
        if (!f.username || !f.password) {
          return '用户名和密码不能为空'
        }
        if (!/^[a-zA-Z0-9_]{4,20}$/.test(f.username)) {
          return '用户名需为 4~20 位字母、数字或下划线'
        }
        if (f.password.length < 6 || f.password.length > 20) {
          return '密码长度需为 6~20 位'
        }
        if (f.password !== f.confirmPassword) {
          return '两次输入的密码不一致'
        }
        if (f.phone && !/^1[3-9]\d{9}$/.test(f.phone)) {
          return '手机号格式不正确'
        }
        return ''
      },
      register() {
        const err = this.check()
        if (err) {
          this.msgColor = '#e1251b'
          this.msg = err
          return
        }
        axios.post("/users/register", this.form)
          .then(() => {
            this.msgColor = '#2e8b57'
            this.msg = '注册成功，正在跳转到登录页...'
            // 注册成功后后端不会自动登录，回到登录页让用户用新账号登录
            setTimeout(() => window.location = './login.html', 1200)
          })
          .catch(error => {
            this.msgColor = '#e1251b'
            const data = error.response && error.response.data
            this.msg = (data && data.msg) ? data.msg : '注册失败，请稍后再试'
          })
      }
    }
  });
</script>
</html>
