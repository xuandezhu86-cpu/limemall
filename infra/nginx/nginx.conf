# limemall 前端 nginx（容器版）
# 与项目自带的 lm-nginx/conf/nginx.conf 等价，只是：
#   1) 站点根目录指向容器内的 /etc/nginx/html（挂载自项目 lm-nginx/html）
#   2) /api 反代到宿主机的网关 host.docker.internal:8080
# 之所以用容器跑：Windows 版 nginx.exe 无法读取含中文的路径
# （nginx: [emerg] CreateFile() ... failed (1113: No mapping for the Unicode character ...)）
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/json;

    sendfile        on;

    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;
        location / {
            root /etc/nginx/html;
            index index.html;
        }
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /etc/nginx/html;
        }
    }

    # 门户
    server {
        listen       18080;
        server_name  localhost;
        location / {
            root /etc/nginx/html/lm-portal;
            index index.html;
        }
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /etc/nginx/html;
        }
        location /api {
            rewrite /api/(.*)  /$1 break;
            proxy_pass http://host.docker.internal:8080;
        }
    }

    # 后台管理
    server {
        listen       18081;
        server_name  localhost;
        location / {
            root /etc/nginx/html/lm-admin;
            index items.html;
        }
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /etc/nginx/html;
        }
        location /api {
            rewrite /api/(.*)  /$1 break;
            proxy_pass http://host.docker.internal:8080;
        }
    }

    # 运营后台
    server {
        listen       18082;
        server_name  localhost;
        location / {
            root /etc/nginx/html/lm-console;
            index index.html;
        }
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /etc/nginx/html;
        }
        location /api {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Real-PORT $remote_port;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            rewrite /api/(.*)  /$1 break;
            proxy_pass http://host.docker.internal:8080;
        }
    }
}
