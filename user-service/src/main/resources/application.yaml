server:
  port: 8084
spring:
  application:
    name: user-service
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://${lm.db.host}:3306/lm_user?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${lm.db.pw}
  cloud:
    nacos:
      server-addr: localhost:8848   # nacos地址
mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto
logging:
  level:
    com.limemall: debug
  pattern:
    dateformat: HH:mm:ss:SSS
  file:
    path: "logs/${spring.application.name}"
knife4j:
  enable: true
  openapi:
    title: 青柠商城用户服务接口文档
    description: "青柠商城用户服务接口文档"
    email: zhanghuyi@example.com
    concat: LimeMall
    url: https://www.example.com
    version: v1.0.0
    group:
      default:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.limemall.user.controller
lm:
  jwt:
    location: classpath:limemall.jks
    alias: limemall
    password: limemall123
    tokenTTL: 30m

# keytool -genkeypair -alias limemall -keyalg RSA -keypass limemall123 -keystore limemall.jks -storepass limemall123
